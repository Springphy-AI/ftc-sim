<svg xmlns="http://www.w3.org/2000/svg" class="ftcfig" viewBox="0 0 760 452" role="img" aria-labelledby="mecanum-grip-title" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="mecanum-grip-title">Each mecanum wheel grips only along its roller axis</title><style>.ftcfig{--f-ink:#1f2328;--f-quiet:#59636e;--f-edge:#818b98;--f-grid:#d1d9e0;--f-tint:#f6f8fa;--f-accent:#0969da;--f-red:#cf222e;--f-warn:#bf8700;--f-good:#1a7f37}@media (prefers-color-scheme: dark){.ftcfig{--f-ink:#e6edf3;--f-quiet:#9198a1;--f-edge:#6e7781;--f-grid:#30363d;--f-tint:#161b22;--f-accent:#4493f8;--f-red:#f85149;--f-warn:#d29922;--f-good:#3fb950}}</style><defs><marker id="mecanum-grip-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-ink)"/></marker><marker id="mecanum-grip-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-accent)"/></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--f-ink)">Each mecanum wheel grips only along its roller axis</text><text x="24" y="52" font-size="11.5" fill="var(--f-quiet)">Top view of the simulated chassis, front up; directions from the robot model’s wheel setup</text><g ><rect x="136" y="144" width="200" height="236" rx="10" fill="var(--f-tint)" stroke="var(--f-ink)" stroke-width="1.5"/><path d="M236 100L236 138" fill="none" stroke="var(--f-ink)" stroke-width="1.5" marker-end="url(#mecanum-grip-arrow-ink)"/></g><text x="244" y="114" font-size="11.5" fill="var(--f-quiet)">front (+x)</text><g ><rect x="98" y="154" width="34" height="70" rx="6" fill="none" stroke="var(--f-ink)" stroke-width="1.25"/><path d="M134.8 208.8L95.2 169.2" fill="none" stroke="var(--f-quiet)" stroke-width="1.25" stroke-dasharray="3 3"/><path d="M83.9 220.1L146.1 157.9" fill="none" stroke="var(--f-accent)" stroke-width="2.5" marker-end="url(#mecanum-grip-arrow-accent)" marker-start="url(#mecanum-grip-arrow-accent)"/></g><g ><rect x="340" y="154" width="34" height="70" rx="6" fill="none" stroke="var(--f-ink)" stroke-width="1.25"/><path d="M376.8 169.2L337.2 208.8" fill="none" stroke="var(--f-quiet)" stroke-width="1.25" stroke-dasharray="3 3"/><path d="M388.1 220.1L325.9 157.9" fill="none" stroke="var(--f-accent)" stroke-width="2.5" marker-end="url(#mecanum-grip-arrow-accent)" marker-start="url(#mecanum-grip-arrow-accent)"/></g><g ><rect x="98" y="300" width="34" height="70" rx="6" fill="none" stroke="var(--f-ink)" stroke-width="1.25"/><path d="M134.8 315.2L95.2 354.8" fill="none" stroke="var(--f-quiet)" stroke-width="1.25" stroke-dasharray="3 3"/><path d="M146.1 366.1L83.9 303.9" fill="none" stroke="var(--f-accent)" stroke-width="2.5" marker-end="url(#mecanum-grip-arrow-accent)" marker-start="url(#mecanum-grip-arrow-accent)"/></g><g ><rect x="340" y="300" width="34" height="70" rx="6" fill="none" stroke="var(--f-ink)" stroke-width="1.25"/><path d="M376.8 354.8L337.2 315.2" fill="none" stroke="var(--f-quiet)" stroke-width="1.25" stroke-dasharray="3 3"/><path d="M325.9 366.1L388.1 303.9" fill="none" stroke="var(--f-accent)" stroke-width="2.5" marker-end="url(#mecanum-grip-arrow-accent)" marker-start="url(#mecanum-grip-arrow-accent)"/></g><text x="112" y="130" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">front_left</text><text x="360" y="130" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">front_right</text><text x="112" y="406" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">back_left</text><text x="360" y="406" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">back_right</text><g ><path d="M452 132L482 132" fill="none" stroke="var(--f-accent)" stroke-width="2.5" marker-end="url(#mecanum-grip-arrow-accent)" marker-start="url(#mecanum-grip-arrow-accent)"/><text x="492" y="128" font-size="11.5" font-weight="600" fill="var(--f-ink)">Roller axis: friction direction 1</text><text x="492" y="144" font-size="11.5" fill="var(--f-quiet)">full traction, μ = 0.9 by default</text><path d="M452 188L482 188" fill="none" stroke="var(--f-quiet)" stroke-width="1.25" stroke-dasharray="3 3"/><text x="492" y="184" font-size="11.5" font-weight="600" fill="var(--f-ink)">Across it: friction direction 2</text><text x="492" y="200" font-size="11.5" fill="var(--f-quiet)">rollers spin, μ₂ = 0.04 by default</text></g><text x="452" y="252" font-size="11.5" fill="var(--f-ink)">Spinning front_left forward pushes the</text><text x="452" y="268" font-size="11.5" fill="var(--f-ink)">robot forward and to the right. Wheels</text><text x="452" y="284" font-size="11.5" fill="var(--f-ink)">on a diagonal share a roller direction,</text><text x="452" y="300" font-size="11.5" fill="var(--f-ink)">so the four wheel speeds set forward,</text><text x="452" y="316" font-size="11.5" fill="var(--f-ink)">sideways and turning motion.</text><text x="452" y="348" font-size="11.5" fill="var(--f-quiet)">Individual rollers are not modeled; a</text><text x="452" y="364" font-size="11.5" fill="var(--f-quiet)">small force-dependent slip lets wheels</text><text x="452" y="380" font-size="11.5" fill="var(--f-quiet)">creep under load instead of locking.</text></svg>
