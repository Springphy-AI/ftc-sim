<svg xmlns="http://www.w3.org/2000/svg" class="ftcfig" viewBox="0 0 760 720" role="img" aria-labelledby="architecture-title" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="architecture-title">Every robot, sensor and camera reads from one 1 kHz physics world</title><style>.ftcfig{--f-ink:#1f2328;--f-quiet:#59636e;--f-edge:#818b98;--f-grid:#d1d9e0;--f-tint:#f6f8fa;--f-accent:#0969da;--f-red:#cf222e;--f-warn:#bf8700;--f-good:#1a7f37}svg:root{background:#ffffff}@media (prefers-color-scheme: dark){.ftcfig{--f-ink:#e6edf3;--f-quiet:#9198a1;--f-edge:#6e7781;--f-grid:#30363d;--f-tint:#161b22;--f-accent:#4493f8;--f-red:#f85149;--f-warn:#d29922;--f-good:#3fb950}svg:root{background:#0d1117}}</style><defs><marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-edge)"/></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--f-ink)">Every robot, sensor and camera reads from one 1 kHz physics world</text><g ><rect x="24" y="264" width="688" height="120" rx="8" fill="var(--f-tint)" stroke="var(--f-edge)" stroke-width="1.25"/><text x="40" y="286" font-weight="600" fill="var(--f-ink)">FTC SDK 12.0 API, checked against FIRST’s jars (115 classes, 1,083 members)</text></g><g ><path d="M124 128L124 160" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M224 180H246V92H268" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M468 92L512 92" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M224 196L268 196" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M468 196L512 196" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M612 232L612 264" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M612 368L612 416" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M224 444L268 444" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M184 488V504H300V520" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M368 488L368 520" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)" marker-start="url(#architecture-arrow)"/><path d="M612 520L612 488" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M224 556L268 556" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M468 556L512 556" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M300 592L300 624" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M344 660L392 660" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)" marker-start="url(#architecture-arrow)"/></g><g ><rect x="24" y="56" width="200" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="124" y="80" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Code editor, in the page</text><text x="124" y="96" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">saves the team’s files,</text><text x="124" y="112" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">underlines javac’s errors</text></g><g ><rect x="268" y="56" width="200" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="368" y="80" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Deploy</text><text x="368" y="96" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">the project’s own Gradle</text><text x="368" y="112" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">build, installed by ADB</text></g><g ><rect x="512" y="56" width="200" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="612" y="80" text-anchor="middle" font-weight="600" fill="var(--f-ink)">The real robot</text><text x="612" y="96" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">Control Hub or phone,</text><text x="612" y="112" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">over USB or Wi-Fi</text></g><g ><rect x="24" y="160" width="200" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="124" y="184" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Team’s project</text><text x="124" y="200" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">TeamCode, unchanged</text><text x="124" y="216" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">your FtcRobotController</text></g><g ><rect x="268" y="160" width="200" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="368" y="184" text-anchor="middle" font-weight="600" fill="var(--f-ink)">TeamCode compiler</text><text x="368" y="200" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">javac --release 8, on save</text><text x="368" y="216" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">skips unsupported files</text></g><g ><rect x="512" y="160" width="200" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="612" y="184" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Class loader per robot</text><text x="612" y="200" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">statics and blackboard</text><text x="612" y="216" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">kept apart per robot</text></g><g ><rect x="40" y="296" width="208" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="144" y="320" text-anchor="middle" font-weight="600" fill="var(--f-ink)">FIRST’s own classes</text><text x="144" y="336" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">Vision, AprilTagProcessor,</text><text x="144" y="352" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">RobotCore math, run as-is</text></g><g ><rect x="264" y="296" width="208" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="368" y="320" text-anchor="middle" font-weight="600" fill="var(--f-ink)">AprilTag C detector</text><text x="368" y="336" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">OpenFTC plugin 2.1.0,</text><text x="368" y="352" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">compiled for PCs</text></g><g ><rect x="488" y="296" width="208" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="592" y="320" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Stand-ins</text><text x="592" y="336" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">HardwareMap, motors,</text><text x="592" y="352" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">sensors, VisionPortalImpl</text></g><g ><rect x="24" y="416" width="200" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="124" y="440" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Robot file per robot</text><text x="124" y="456" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">devices, drive, chassis;</text><text x="124" y="472" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">JSON, or CAD (STEP, URDF)</text></g><g ><rect x="268" y="416" width="444" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="490" y="440" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Simulated hardware (ftcsim.hal)</text><text x="490" y="456" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">hub firmware and PIDF, bus latency, bulk caching,</text><text x="490" y="472" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">battery, sensor mounts from the robot file</text></g><g ><rect x="24" y="520" width="200" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="124" y="544" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Season pack</text><text x="124" y="560" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">season.json and Java</text><text x="124" y="576" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">BIOBUZZ (default), DECODE</text></g><g ><rect x="268" y="520" width="200" height="72" rx="8" fill="var(--f-accent)" stroke="var(--f-accent)" stroke-width="2" fill-opacity="0.12"/><text x="368" y="544" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Physics at 1 kHz</text><text x="368" y="560" text-anchor="middle" font-size="11.5" fill="var(--f-ink)">ODE4j: robots, game pieces,</text><text x="368" y="576" text-anchor="middle" font-size="11.5" fill="var(--f-ink)">field, motors, battery sag</text></g><g ><rect x="512" y="520" width="200" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="612" y="544" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Webcam renderer</text><text x="612" y="560" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">software, SDK lens table</text><text x="612" y="576" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">30 fps, 50 ms latency</text></g><g ><rect x="24" y="624" width="320" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="184" y="648" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Web server</text><text x="184" y="664" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">Javalin over WebSocket</text><text x="184" y="680" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">state out, gamepads in</text></g><g ><rect x="392" y="624" width="320" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="552" y="648" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Browser</text><text x="552" y="664" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">Three.js 3D view, Driver Station</text><text x="552" y="680" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">Xbox, PlayStation, keyboard</text></g><text x="132" y="148" font-size="11.5" fill="var(--f-quiet)">saves</text><text x="254" y="148" font-size="11.5" fill="var(--f-quiet)">builds</text><text x="490" y="84" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">app</text><text x="378" y="508" font-size="11.5" fill="var(--f-quiet)">torques, readings</text><text x="622" y="508" font-size="11.5" fill="var(--f-quiet)">frames</text><text x="246" y="548" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">shapes</text><text x="490" y="548" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">poses</text><text x="310" y="612" font-size="11.5" fill="var(--f-quiet)">world state</text></svg>
