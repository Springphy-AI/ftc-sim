<svg xmlns="http://www.w3.org/2000/svg" class="ftcfig" viewBox="0 0 760 616" role="img" aria-labelledby="architecture-title" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="architecture-title">Every robot, sensor and camera reads from one 1 kHz physics world</title><style>.ftcfig{--f-ink:#1f2328;--f-quiet:#59636e;--f-edge:#818b98;--f-grid:#d1d9e0;--f-tint:#f6f8fa;--f-accent:#0969da;--f-red:#cf222e;--f-warn:#bf8700;--f-good:#1a7f37}@media (prefers-color-scheme: dark){.ftcfig{--f-ink:#e6edf3;--f-quiet:#9198a1;--f-edge:#6e7781;--f-grid:#30363d;--f-tint:#161b22;--f-accent:#4493f8;--f-red:#f85149;--f-warn:#d29922;--f-good:#3fb950}}</style><defs><marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-edge)"/></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--f-ink)">Every robot, sensor and camera reads from one 1 kHz physics world</text><g ><rect x="24" y="160" width="688" height="120" rx="8" fill="var(--f-tint)" stroke="var(--f-edge)" stroke-width="1.25"/><text x="40" y="182" font-weight="600" fill="var(--f-ink)">FTC SDK 12.0 API, checked against FIRST’s jars (115 classes, 1,083 members)</text></g><g ><path d="M224 92L268 92" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M468 92L512 92" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M612 128L612 160" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M612 264L612 312" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M224 340L268 340" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M184 384V400H300V416" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M368 384L368 416" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)" marker-start="url(#architecture-arrow)"/><path d="M612 416L612 384" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M224 452L268 452" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M468 452L512 452" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M300 488L300 520" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)"/><path d="M344 556L392 556" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#architecture-arrow)" marker-start="url(#architecture-arrow)"/></g><g ><rect x="24" y="56" width="200" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="124" y="80" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Team’s project</text><text x="124" y="96" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">TeamCode, unchanged</text><text x="124" y="112" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">your FtcRobotController</text></g><g ><rect x="268" y="56" width="200" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="368" y="80" text-anchor="middle" font-weight="600" fill="var(--f-ink)">TeamCode compiler</text><text x="368" y="96" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">javac --release 8, on save</text><text x="368" y="112" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">skips unsupported files</text></g><g ><rect x="512" y="56" width="200" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="612" y="80" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Class loader per robot</text><text x="612" y="96" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">statics and blackboard</text><text x="612" y="112" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">kept apart per robot</text></g><g ><rect x="40" y="192" width="208" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="144" y="216" text-anchor="middle" font-weight="600" fill="var(--f-ink)">FIRST’s own classes</text><text x="144" y="232" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">Vision, AprilTagProcessor,</text><text x="144" y="248" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">RobotCore math, run as-is</text></g><g ><rect x="264" y="192" width="208" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="368" y="216" text-anchor="middle" font-weight="600" fill="var(--f-ink)">AprilTag C detector</text><text x="368" y="232" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">OpenFTC plugin 2.1.0,</text><text x="368" y="248" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">compiled for PCs</text></g><g ><rect x="488" y="192" width="208" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="592" y="216" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Stand-ins</text><text x="592" y="232" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">HardwareMap, motors,</text><text x="592" y="248" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">sensors, VisionPortalImpl</text></g><g ><rect x="24" y="312" width="200" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="124" y="336" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Robot file per robot</text><text x="124" y="352" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">devices, drive, chassis;</text><text x="124" y="368" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">JSON, or CAD (STEP, URDF)</text></g><g ><rect x="268" y="312" width="444" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="490" y="336" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Simulated hardware (ftcsim.hal)</text><text x="490" y="352" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">hub firmware and PIDF, bus latency, bulk caching,</text><text x="490" y="368" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">battery, sensor mounts from the robot file</text></g><g ><rect x="24" y="416" width="200" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="124" y="440" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Season pack</text><text x="124" y="456" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">season.json and Java</text><text x="124" y="472" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">BIOBUZZ (default), DECODE</text></g><g ><rect x="268" y="416" width="200" height="72" rx="8" fill="var(--f-accent)" stroke="var(--f-accent)" stroke-width="2" fill-opacity="0.12"/><text x="368" y="440" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Physics at 1 kHz</text><text x="368" y="456" text-anchor="middle" font-size="11.5" fill="var(--f-ink)">ODE4j: robots, game pieces,</text><text x="368" y="472" text-anchor="middle" font-size="11.5" fill="var(--f-ink)">field, motors, battery sag</text></g><g ><rect x="512" y="416" width="200" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="612" y="440" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Webcam renderer</text><text x="612" y="456" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">software, SDK lens table</text><text x="612" y="472" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">30 fps, 50 ms latency</text></g><g ><rect x="24" y="520" width="320" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="184" y="544" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Web server</text><text x="184" y="560" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">Javalin over WebSocket</text><text x="184" y="576" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">state out, gamepads in</text></g><g ><rect x="392" y="520" width="320" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="552" y="544" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Browser</text><text x="552" y="560" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">Three.js 3D view, Driver Station</text><text x="552" y="576" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">Xbox, PlayStation, keyboard</text></g><text x="378" y="404" font-size="11.5" fill="var(--f-quiet)">torques, readings</text><text x="622" y="404" font-size="11.5" fill="var(--f-quiet)">frames</text><text x="246" y="444" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">shapes</text><text x="490" y="444" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">poses</text><text x="310" y="508" font-size="11.5" fill="var(--f-quiet)">world state</text></svg>
