="var(--f-ink)">page ?robot=3</text><text x="652" y="172" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Robot 4</text><text x="652" y="192" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">own class loader</text><text x="652" y="208" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">TeamCode, OpMode</text><text x="652" y="224" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">robot file, gamepads</text><text x="652" y="240" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">telemetry, log</text><text x="652" y="256" text-anchor="middle" font-size="11.5" fill="var(--f-ink)">page ?robot=4</text><g ><rect x="24" y="312" width="712" height="72" rx="8" fill="var(--f-accent)" stroke="var(--f-accent)" stroke-width="2" fill-opacity="0.12"/></g><text x="380" y="336" text-anchor="middle" font-weight="600" fill="var(--f-ink)">One physics world (ODE4j, 1 kHz)</text><text x="380" y="352" text-anchor="middle" font-size="11.5" fill="var(--f-ink)">BIOBUZZ field, 56 balls, two HIVES</text><text x="380" y="368" text-anchor="middle" font-size="11.5" fill="var(--f-ink)">robots collide, push each other, and appear in each other’s distance sensors and webcams</text><g ><path d="M106 116L106 148" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#match-robots-arrow)"/><path d="M106 268L106 312" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#match-robots-arrow)" marker-start="url(#match-robots-arrow)"/><path d="M288 116L288 148" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#match-robots-arrow)"/><path d="M288 268L288 312" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#match-robots-arrow)" marker-start="url(#match-robots-arrow)"/><path d="M470 116L470 148" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#match-robots-arrow)"/><path d="M470 268L470 312" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#match-robots-arrow)" marker-start="url(#match-robots-arrow)"/><path d="M652 116L652 148" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#match-robots-arrow)"/><path d="M652 268L652 312" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#match-robots-arrow)" marker-start="url(#match-robots-arrow)"/></g><text x="114" y="294" font-size="11.5" fill="var(--f-quiet)">torques, readings</text><text x="24" y="406" font-size="11.5" fill="var(--f-quiet)">Kept per robot: static fields, OpMode.blackboard, RobotLog’s global error, bus latency settings.</text></svg>
