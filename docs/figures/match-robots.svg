<svg xmlns="http://www.w3.org/2000/svg" class="ftcfig" viewBox="0 0 760 420" role="img" aria-labelledby="match-robots-title" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="match-robots-title">Four robots share one physics world, but each runs its own code in isolation</title><style>.ftcfig{--f-ink:#1f2328;--f-quiet:#59636e;--f-edge:#818b98;--f-grid:#d1d9e0;--f-tint:#f6f8fa;--f-accent:#0969da;--f-red:#cf222e;--f-warn:#bf8700;--f-good:#1a7f37}svg:root{background:#ffffff}@media (prefers-color-scheme: dark){.ftcfig{--f-ink:#e6edf3;--f-quiet:#9198a1;--f-edge:#6e7781;--f-grid:#30363d;--f-tint:#161b22;--f-accent:#4493f8;--f-red:#f85149;--f-warn:#d29922;--f-good:#3fb950}svg:root{background:#0d1117}}</style><defs><marker id="match-robots-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-edge)"/></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--f-ink)">Four robots share one physics world, but each runs its own code in isolation</text><text x="24" y="52" font-size="11.5" fill="var(--f-quiet)">Each robot is a separate Robot Controller; they share only the physics world and the match start</text><g ><rect x="24" y="72" width="712" height="44" rx="8" fill="var(--f-tint)" stroke="var(--f-edge)" stroke-width="1.25"/></g><text x="380" y="92" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Match control: INIT all, START all</text><text x="380" y="108" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">every robot’s OpMode starts at the same moment, so the 30 s autonomous timers line up</text><g ><rect x="24" y="148" width="164" height="120" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/></g><g ><rect x="206" y="148" width="164" height="120" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/></g><g ><rect x="388" y="148" width="164" height="120" 