<svg xmlns="http://www.w3.org/2000/svg" class="ftcfig" viewBox="0 0 760 640" role="img" aria-labelledby="cad-import-title" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="cad-import-title">The CAD gives the shape and mass, the robot file the devices and limits</title><style>.ftcfig{--f-ink:#1f2328;--f-quiet:#59636e;--f-edge:#818b98;--f-grid:#d1d9e0;--f-tint:#f6f8fa;--f-accent:#0969da;--f-red:#cf222e;--f-warn:#bf8700;--f-good:#1a7f37}svg:root{background:#ffffff}@media (prefers-color-scheme: dark){.ftcfig{--f-ink:#e6edf3;--f-quiet:#9198a1;--f-edge:#6e7781;--f-grid:#30363d;--f-tint:#161b22;--f-accent:#4493f8;--f-red:#f85149;--f-warn:#d29922;--f-good:#3fb950}svg:root{background:#0d1117}}</style><defs><marker id="cad-import-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-edge)"/></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--f-ink)">The CAD gives the shape and mass, the robot file the devices and limits</text><text x="24" y="52" font-size="11.5" fill="var(--f-quiet)">A STEP file is converted once in the browser; a URDF already has its joints and masses</text><g ><path d="M132 128L132 160" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#cad-import-arrow)"/><path d="M132 216L132 248" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#cad-import-arrow)"/><path d="M132 304L132 336" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#cad-import-arrow)"/><path d="M132 408L132 440" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#cad-import-arrow)"/><path d="M380 128L380 440" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#cad-import-arrow)"/><path d="M628 128L628 440" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#cad-import-arrow)"/><path d="M194 496L194 528" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#cad-import-arrow)"/><path d="M566 496L566 528" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#cad-import-arrow)"/></g><g ><rect x="24" y="72" width="216" height="56" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="132" y="96" text-anchor="middle" font-weight="600" fill="var(--f-ink)">STEP file</text><text x="132" y="112" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">the assembly, as exported</text></g><g ><rect x="272" y="72" width="216" height="56" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="380" y="96" text-anchor="middle" font-weight="600" fill="var(--f-ink)">URDF and meshes</text><text x="380" y="112" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">links, joints, STL or OBJ</text></g><g ><rect x="520" y="72" width="216" height="56" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="628" y="96" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Robot file (JSON)</text><text x="628" y="112" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">devices, drive, cad section</text></g><g ><rect x="24" y="160" width="216" height="56" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="132" y="184" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Converted in the browser</text><text x="132" y="200" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">OpenCascade in WebAssembly</text></g><g ><rect x="24" y="248" width="216" height="56" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="132" y="272" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Saved triangles</text><text x="132" y="288" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">name.step.cadmesh + SHA-256</text></g><g ><rect x="24" y="336" width="216" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="132" y="360" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Worked out from names</text><text x="132" y="376" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">facing, drive wheels,</text><text x="132" y="392" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">rollers, flywheels, link axes</text></g><g ><rect x="24" y="440" width="712" height="56" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="380" y="464" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Model builder</text><text x="380" y="480" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">mass properties from the meshes, oriented collision boxes per part, a joint for each moving link</text></g><g ><rect x="24" y="528" width="340" height="88" rx="8" fill="var(--f-accent)" stroke="var(--f-accent)" stroke-width="2" fill-opacity="0.12"/><text x="194" y="552" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Physics world (ODE4j, 1 kHz)</text><text x="194" y="568" text-anchor="middle" font-size="11.5" fill="var(--f-ink)">chassis and wheels as bodies,</text><text x="194" y="584" text-anchor="middle" font-size="11.5" fill="var(--f-ink)">links on hinge and slider joints,</text><text x="194" y="600" text-anchor="middle" font-size="11.5" fill="var(--f-ink)">driven by the robot’s motors and servos</text></g><g ><rect x="396" y="528" width="340" height="88" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/><text x="566" y="552" text-anchor="middle" font-weight="600" fill="var(--f-ink)">3D view and webcams</text><text x="566" y="568" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">drawn from the CAD meshes,</text><text x="566" y="584" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">simplified for the webcam renderer</text></g><text x="390" y="272" font-size="11.5" fill="var(--f-quiet)">its own joints and masses</text><text x="618" y="320" text-anchor="end" font-size="11.5" fill="var(--f-quiet)">devices and drive;</text><text x="618" y="336" text-anchor="end" font-size="11.5" fill="var(--f-quiet)">for each moving link:</text><text x="618" y="352" text-anchor="end" font-size="11.5" fill="var(--f-quiet)">part, device, limits</text></svg>
