<svg xmlns="http://www.w3.org/2000/svg" class="ftcfig" viewBox="0 0 760 508" role="img" aria-labelledby="vision-pipeline-title" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="vision-pipeline-title">Only the image is simulated: FIRST’s code finds the tags and solves their pose</title><style>.ftcfig{--f-ink:#1f2328;--f-quiet:#59636e;--f-edge:#818b98;--f-grid:#d1d9e0;--f-tint:#f6f8fa;--f-accent:#0969da;--f-red:#cf222e;--f-warn:#bf8700;--f-good:#1a7f37}svg:root{background:#ffffff}@media (prefers-color-scheme: dark){.ftcfig{--f-ink:#e6edf3;--f-quiet:#9198a1;--f-edge:#6e7781;--f-grid:#30363d;--f-tint:#161b22;--f-accent:#4493f8;--f-red:#f85149;--f-warn:#d29922;--f-good:#3fb950}svg:root{background:#0d1117}}</style><defs><marker id="vision-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-edge)"/></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--f-ink)">Only the image is simulated: FIRST’s code finds the tags and solves their pose</text><text x="24" y="52" font-size="11.5" fill="var(--f-quiet)">One webcam frame, from the physics state to the detections a team’s OpMode reads</text><g ><rect x="24" y="68" width="712" height="128" rx="10" fill="var(--f-tint)" stroke="var(--f-grid)" stroke-width="1"/></g><g ><rect x="24" y="212" width="712" height="164" rx="10" fill="var(--f-accent)" stroke="var(--f-accent)" stroke-width="1.25" fill-opacity="0.06"/></g><g ><rect x="24" y="392" width="712" height="92" rx="10" fill="var(--f-tint)" stroke="var(--f-grid)" stroke-width="1"/></g><text x="40" y="90" font-size="11.5" font-weight="600" fill="var(--f-quiet)">Simulator</text><text x="40" y="234" font-size="11.5" font-weight="600" fill="var(--f-quiet)">FIRST’s code, unmodified</text><text x="40" y="414" font-size="11.5" font-weight="600" fill="var(--f-quiet)">Team code</text><g ><rect x="40" y="104" width="196" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/></g><text x="138" y="128" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Physics state</text><text x="138" y="144" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">world as it was 50 ms earlier</text><text x="138" y="160" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">(the camera’s latency)</text><g ><rect x="268" y="104" width="196" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/></g><text x="366" y="128" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Webcam renderer</text><text x="366" y="144" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">software rasterizer, pinhole</text><text x="366" y="160" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">30 frames/s by default</text><g ><rect x="524" y="104" width="196" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/></g><text x="622" y="128" text-anchor="middle" font-weight="600" fill="var(--f-ink)">VisionPortal stand-in</text><text x="622" y="144" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">RGBA frame + capture time</text><text x="622" y="160" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">camera states, FPS, streaming</text><g ><rect x="40" y="248" width="196" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/></g><text x="138" y="272" text-anchor="middle" font-weight="600" fill="var(--f-ink)">SDK calibration table</text><text x="138" y="288" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">lens intrinsics per webcam,</text><text x="138" y="304" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">by USB vendor and product ID</text><g ><rect x="268" y="248" width="196" height="72" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/></g><text x="366" y="272" text-anchor="middle" font-weight="600" fill="var(--f-ink)">AprilTag C detector</text><text x="366" y="288" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">OpenFTC plugin 2.1.0, built</text><text x="366" y="304" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">for Windows, Linux and macOS</text><g ><rect x="524" y="248" width="196" height="72" rx="8" fill="var(--f-accent)" stroke="var(--f-accent)" stroke-width="2" fill-opacity="0.12"/></g><text x="622" y="272" text-anchor="middle" font-weight="600" fill="var(--f-ink)">AprilTagProcessor</text><text x="622" y="288" text-anchor="middle" font-size="11.5" fill="var(--f-ink)">solves each tag’s pose with</text><text x="622" y="304" text-anchor="middle" font-size="11.5" fill="var(--f-ink)">the same lens intrinsics</text><g ><rect x="524" y="420" width="196" height="56" rx="8" fill="none" stroke="var(--f-edge)" stroke-width="1.25"/></g><text x="622" y="444" text-anchor="middle" font-weight="600" fill="var(--f-ink)">Team’s OpMode</text><text x="622" y="460" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">reads IDs and poses</text><g ><path d="M236 140L268 140" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#vision-pipeline-arrow)"/><path d="M464 140L524 140" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#vision-pipeline-arrow)"/><path d="M622 176L622 248" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#vision-pipeline-arrow)"/><path d="M220 248V196H324V176" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#vision-pipeline-arrow)"/><path d="M524 274L464 274" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#vision-pipeline-arrow)"/><path d="M464 298L524 298" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#vision-pipeline-arrow)"/><path d="M138.0 320V344H564V320" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#vision-pipeline-arrow)"/><path d="M674 320L674 420" fill="none" stroke="var(--f-edge)" stroke-width="1.25" marker-end="url(#vision-pipeline-arrow)"/></g><text x="228" y="190" font-size="11.5" fill="var(--f-quiet)">lens intrinsics</text><text x="630" y="200" font-size="11.5" fill="var(--f-quiet)">frame</text><text x="496" y="268" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">frame</text><text x="496" y="314" text-anchor="middle" font-size="11.5" fill="var(--f-quiet)">corners</text><text x="146" y="338" font-size="11.5" fill="var(--f-quiet)">same entry, looked up by the webcam’s USB IDs</text><text x="666" y="366" text-anchor="end" font-size="11.5" fill="var(--f-quiet)">detections</text></svg>
