<svg xmlns="http://www.w3.org/2000/svg" class="ftcfig" viewBox="0 0 760 492" role="img" aria-labelledby="hive-seesaw-title" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="hive-seesaw-title">A HIVE tips when the balls’ moment beats its own holding moment</title><style>.ftcfig{--f-ink:#1f2328;--f-quiet:#59636e;--f-edge:#818b98;--f-grid:#d1d9e0;--f-tint:#f6f8fa;--f-accent:#0969da;--f-red:#cf222e;--f-warn:#bf8700;--f-good:#1a7f37}svg:root{background:#ffffff}@media (prefers-color-scheme: dark){.ftcfig{--f-ink:#e6edf3;--f-quiet:#9198a1;--f-edge:#6e7781;--f-grid:#30363d;--f-tint:#161b22;--f-accent:#4493f8;--f-red:#f85149;--f-warn:#d29922;--f-good:#3fb950}svg:root{background:#0d1117}}</style><defs><marker id="hive-seesaw-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-ink)"/></marker><marker id="hive-seesaw-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-accent)"/></marker><marker id="hive-seesaw-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--f-red)"/></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--f-ink)">A HIVE tips when the balls’ moment beats its own holding moment</text><text x="24" y="52" font-size="11.5" fill="var(--f-quiet)">Side view along the pivot axis, rear CELL up against its 30° stop; center-of-mass offset drawn larger than scale</text><g ><path d="M142 256L622 256" fill="none" stroke="var(--f-grid)" stroke-width="1" stroke-dasharray="4 4"/></g><g ><path d="M372 256L326 406M372 256L418 406" fill="none" stroke="var(--f-edge)" stroke-width="2"/><path d="M302 406L442 406" fill="none" stroke="var(--f-edge)" stroke-width="2"/><text x="428" y="396" font-size="11.5" fill="var(--f-quiet)">HIVE structure</text></g><g ><path d="M427 145.5L468.6 217.6" fill="none" stroke="var(--f-ink)" stroke-width="2.5"/><path d="M468.6 217.6L582.5 151.8" fill="none" stroke="var(--f-ink)" stroke-width="2.5"/><path d="M427 145.5L540.9 79.8" fill="none" stroke="var(--f-edge)" stroke-width="1.25" stroke-dasharray="4 3"/><path d="M582.5 151.8L540.9 79.8" fill="none" stroke="var(--f-edge)" stroke-width="1" stroke-dasharray="2 4"/></g><g ><path d="M372 256L461.1 204.6" fill="none" stroke="var(--f-ink)" stroke-width="4"/></g><g ><path d="M248.8 248.4L290.4 320.5" fill="none" stroke="var(--f-ink)" stroke-width="2.5"/><path d="M290.4 320.5L176.5 386.2" fill="none" stroke="var(--f-ink)" stroke-width="2.5"/><path d="M248.8 248.4L134.9 314.2" fill="none" stroke="var(--f-edge)" stroke-width="1.25" stroke-dasharray="4 3"/><path d="M176.5 386.2L134.9 314.2" fill="none" stroke="var(--f-edge)" stroke-width="1" stroke-dasharray="2 4"/></g><g ><path d="M372 256L282.9 307.4" fill="none" stroke="var(--f-ink)" stroke-width="4"/></g><g ><circle cx="475.8" cy="190.9" r="19.6" fill="var(--f-warn)" stroke="var(--f-ink)" stroke-width="1" fill-opacity="0.35"/><circle cx="509.7" cy="171.3" r="19.6" fill="var(--f-warn)" stroke="var(--f-ink)" stroke-width="1" fill-opacity="0.35"/><circle cx="542" cy="157.6" r="15.3" fill="var(--f-warn)" stroke="var(--f-ink)" stroke-width="1" fill-opacity="0.35"/></g><g ><circle cx="372" cy="256" r="6.5" fill="var(--f-tint)" stroke="var(--f-ink)" stroke-width="1.5"/></g><g ><path d="M372 256L353.5 223.9" fill="none" stroke="var(--f-ink)" stroke-width="1" stroke-dasharray="2 2"/><circle cx="353.5" cy="223.9" r="4.5" fill="var(--f-ink)" stroke="none"/><path d="M353.5 229.9L353.5 281.9" fill="none" stroke="var(--f-ink)" stroke-width="1.5" marker-end="url(#hive-seesaw-arrow-ink)"/></g><g ><path d="M347.5 217.9L327.5 183.9" fill="none" stroke="var(--f-quiet)" stroke-width="1"/></g><text x="323.5" y="163.9" text-anchor="end" font-size="11.5" font-weight="600" fill="var(--f-ink)">center of mass, 34.5 mm</text><text x="323.5" y="179.9" text-anchor="end" font-size="11.5" fill="var(--f-quiet)">above the pivot; its weight acts here</text><g ><path d="M509.7 194.9L509.7 242.9" fill="none" stroke="var(--f-ink)" stroke-width="1.5" marker-end="url(#hive-seesaw-arrow-ink)"/></g><text x="517.7" y="236.9" font-size="11.5" fill="var(--f-ink)">balls’ weight</text><g ><path d="M281.8 223.2A96 96 0 0 0 278.9 279.2" fill="none" stroke="var(--f-accent)" stroke-width="2" marker-end="url(#hive-seesaw-arrow-accent)"/></g><text x="266" y="214" text-anchor="end" font-size="11.5" font-weight="600" fill="var(--f-ink)">holding moment</text><text x="266" y="230" text-anchor="end" font-size="11.5" fill="var(--f-quiet)">pulls this side down</text><g ><path d="M465.9 236A96 96 0 0 1 461 292" fill="none" stroke="var(--f-red)" stroke-width="2" marker-end="url(#hive-seesaw-arrow-red)"/></g><text x="480" y="276" font-size="11.5" font-weight="600" fill="var(--f-ink)">tipping moment</text><text x="480" y="292" font-size="11.5" fill="var(--f-quiet)">pulls this side down</text><g ><path d="M327 282A52 52 0 0 1 320 256" fill="none" stroke="var(--f-quiet)" stroke-width="1"/></g><text x="302" y="274" font-size="11.5" fill="var(--f-quiet)">30°</text><text x="592.5" y="147.8" font-size="11.5" fill="var(--f-quiet)">open end</text><text x="421" y="137.5" text-anchor="end" font-size="11.5" fill="var(--f-quiet)">closed end</text><text x="560.5" y="69.8" font-size="11.5" font-weight="600" fill="var(--f-ink)">CELL facing up</text><text x="182.5" y="412.2" font-size="11.5" font-weight="600" fill="var(--f-ink)">CELL facing down</text><text x="24" y="452" font-size="11.5" fill="var(--f-quiet)">Each side’s moment = weight × horizontal distance from the pivot; a damper at the pivot slows the swing.</text><text x="24" y="470" font-size="11.5" fill="var(--f-quiet)">When the balls win, the HIVE swings to its other stop and these balls roll out of the lowered open end.</text></svg>
