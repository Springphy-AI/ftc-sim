plugins {
    id 'application'
}

configurations {
    // The official FTC SDK, used only by ApiConformanceTest to check that the simulator's SDK
    // exposes nothing the real one doesn't (so TeamCode that builds here builds for the robot).
    realFtcSdk {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def ftcSdkVersion = '12.0.0'

// OpenCascade compiled to WebAssembly (occt-import-js), which the Driver Station page runs to turn
// a robot's STEP file into triangles. It comes from npm, as a plain download Gradle caches.
def occtImportJsVersion = '0.0.23'

repositories {
    exclusiveContent {
        forRepository {
            ivy {
                name = 'npm'
                url = 'https://registry.npmjs.org'
                patternLayout { artifact '[module]/-/[module]-[revision].[ext]' }
                metadataSources { artifact() }
            }
        }
        filter { includeGroup 'npm' }
    }
}

configurations {
    occtImportJs {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    occtImportJs "npm:occt-import-js:${occtImportJsVersion}@tgz"
}

def occtWebDir = layout.buildDirectory.dir('generated/occt')
def unpackOcct = tasks.register('unpackOcct', Sync) {
    description = 'Puts occt-import-js (the STEP reader the Driver Station page uses) into the web resources.'
    from({ tarTree(configurations.occtImportJs.singleFile) }) {
        // (js/occt-worker.js, not the package's own worker, runs it: it reports failures)
        include 'package/dist/occt-import-js.js', 'package/dist/occt-import-js.wasm', 'package/dist/license.*'
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }
    into occtWebDir.map { it.dir('web/vendor/occt') }
}
sourceSets.main.resources.srcDir(occtWebDir)
tasks.named('processResources') { dependsOn unpackOcct }

// Season packs: seasons/<id>/ holds the game's season.json and, for what data can't say, Java in
// package <id>. The Java is compiled into the simulator; the season.json files are read from
// seasons/ when it is there, and are also built in (with a list of them) for an installed copy.
def seasonsDir = rootProject.file('seasons')
sourceSets.main.java.srcDir(seasonsDir)
def seasonsOut = layout.buildDirectory.dir('generated/seasons')
def copySeasons = tasks.register('copySeasons') {
    description = "Builds the season packs' season.json files, and a list of them, into the simulator."
    inputs.files(fileTree(seasonsDir) { include '*/season.json' })
    outputs.dir(seasonsOut)
    doLast {
        def out = new File(seasonsOut.get().asFile, 'seasons')
        out.deleteDir()
        out.mkdirs()
        def ids = []
        seasonsDir.eachDir { d ->
            def json = new File(d, 'season.json')
            if (json.isFile()) {
                ids << d.name
                new File(out, d.name).mkdirs()
                new File(out, "${d.name}/season.json").bytes = json.bytes
            }
        }
        new File(out, 'index.txt').text = ids.sort().join('\n') + '\n'
    }
}
sourceSets.main.resources.srcDir(seasonsOut)
tasks.named('processResources') { dependsOn copySeasons }

dependencies {
    implementation project(':sdk')
    implementation 'org.ode4j:core:0.5.4'          // rigid-body physics (pure-Java port of ODE)
    implementation 'io.javalin:javalin:7.2.4'      // HTTP + WebSocket server for the browser UI
    implementation 'com.google.code.gson:gson:2.15.0'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.20'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    realFtcSdk "org.firstinspires.ftc:RobotCore:${ftcSdkVersion}@aar"
    realFtcSdk "org.firstinspires.ftc:Hardware:${ftcSdkVersion}@aar"
    realFtcSdk "org.firstinspires.ftc:Vision:${ftcSdkVersion}@aar"
    realFtcSdk "org.openftc:easyopencv:1.7.3@aar"                 // what FTC SDK 12.0's Vision depends on
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

// The AprilTag detector FIRST's SDK calls (System.loadLibrary("apriltag")), compiled for this
// machine; see natives/apriltag/README.md. It has to be on java.library.path when the JVM starts.
def aprilTagNatives = rootProject.file("natives/apriltag/${rootProject.simPlatform}")

application {
    mainClass = 'ftcsim.Main'
    applicationName = 'ftc-sim'
    applicationDefaultJvmArgs = ['-Djava.library.path=__APP_HOME__/natives']
}

distributions {
    main {
        contents {
            from(aprilTagNatives) { into 'natives' }
        }
    }
}

tasks.named('startScripts') {
    // Point java.library.path at the install's natives/ folder, wherever the install is.
    doLast {
        unixScript.text = unixScript.text.replace('__APP_HOME__', '\'"$APP_HOME"\'')
        windowsScript.text = windowsScript.text.replace('__APP_HOME__', '%APP_HOME%')
    }
}

tasks.named('run') {
    // Not the start scripts' placeholder (applicationDefaultJvmArgs): this machine's natives folder.
    jvmArguments.set(["-Djava.library.path=${aprilTagNatives.absolutePath}".toString()])
    workingDir = rootProject.projectDir
    standardInput = System.in
    // Pass simulator options with: gradlew run --args="--project C:/path/to/FtcRobotController"
}

def realSdkDir = layout.buildDirectory.dir('real-ftc-sdk')

def extractRealFtcSdk = tasks.register('extractRealFtcSdk') {
    def aars = configurations.realFtcSdk
    inputs.files(aars)
    outputs.dir(realSdkDir)
    doLast {
        def out = realSdkDir.get().asFile
        out.mkdirs()
        aars.each { aar ->
            def zip = new java.util.zip.ZipFile(aar)
            try {
                def entry = zip.getEntry('classes.jar')
                new File(out, aar.name.replace('.aar', '.jar')).withOutputStream { os -> os << zip.getInputStream(entry) }
            } finally {
                zip.close()
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn extractRealFtcSdk
    workingDir = rootProject.projectDir
    systemProperty 'ftcsim.realSdkDir', realSdkDir.get().asFile.absolutePath
    systemProperty 'java.library.path', aprilTagNatives.absolutePath
    // Where OpenCV and the AprilTag detector exist for this machine, vision tests must run, not skip.
    systemProperty 'ftcsim.visionExpected',
            (rootProject.javacppPlatform != null && new File(aprilTagNatives, System.mapLibraryName('apriltag')).isFile()).toString()
    systemProperty 'ftcsim.simSdkClasses', "${rootDir}/sdk/build/classes/java/main"
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}
